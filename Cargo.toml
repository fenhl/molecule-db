[package]
name = "molecule-db"
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.rust]
rust_2018_idioms = "deny"
unsafe_code = "forbid"
unstable_name_collisions = "allow"
unused = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
warnings = "deny"

[build-dependencies]
git2 = "0.20" # gix is much slower here
thiserror = "2"

[dependencies]
async-proto = "0.26"
base64 = "0.22.1"
collect-mac = "0.1.0"
enum-iterator = "2.1.0"
itertools = "0.14"
mimalloc = "0.1.43"
omsim-rs = { git = "https://github.com/fenhl/omsim-rs.git", branch = "dev-fenhl" }
rocket = { version = "0.5.1", features = ["json"] }
rocket-util = { git = "https://github.com/fenhl/rocket-util", branch = "main" }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
